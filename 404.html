<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 · Esta jugada no existe — Chess Producciones</title>
  <meta name="description" content="La página que buscás no está en el tablero. Volvé al inicio para seguir explorando Chess Producciones.">
  <meta name="robots" content="noindex, follow">
  <link rel="canonical" href="https://chessproducciones.com/404">
  <meta name="theme-color" content="#000000">
  <link rel="icon" href="/assets/img/icons/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/img/icons/favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/img/icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Nunito+Sans:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --c-black: #000;
      --c-ink: #fff;
      --c-ink-50: rgba(255,255,255,0.5);
      --c-ink-30: rgba(255,255,255,0.28);
      --c-ink-10: rgba(255,255,255,0.1);
      --c-blue: #1E32F5;
      --ff-display: 'Pricedown', 'Anton', 'Archivo Black', sans-serif;
      --ff-body: 'Nunito Sans', system-ui, sans-serif;
      --ease: cubic-bezier(0.16, 1, 0.3, 1);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      background: var(--c-black);
      color: var(--c-ink);
      font-family: var(--ff-body);
      min-height: 100vh;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }
    ::selection { background: var(--c-blue); color: #fff; }
    .header {
      position: fixed; top: 0; left: 0; right: 0;
      height: 68px;
      display: flex; align-items: center;
      padding: 0 clamp(1.25rem, 4vw, 3rem);
      border-bottom: 1px solid var(--c-ink-10);
      z-index: 10;
    }
    .header a {
      color: var(--c-ink);
      text-decoration: none;
      font-family: var(--ff-display);
      font-size: 1.4rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    main {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 7rem clamp(1.25rem, 4vw, 3rem) 6rem;
    }
    .stage {
      max-width: 960px;
      width: 100%;
      text-align: left;
      position: relative;
    }
    .eyebrow {
      font-family: var(--ff-body);
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: var(--c-ink-50);
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .eyebrow::before {
      content: '';
      width: 28px;
      height: 1px;
      background: var(--c-ink-30);
    }
    h1 {
      font-family: var(--ff-display);
      font-size: clamp(8rem, 28vw, 22rem);
      line-height: 0.85;
      letter-spacing: -0.04em;
      margin-bottom: 1.5rem;
      color: var(--c-ink);
      text-transform: uppercase;
    }
    h1 .accent {
      color: var(--c-blue);
      text-shadow: 0 0 60px rgba(30, 50, 245, 0.45);
    }
    h2 {
      font-family: var(--ff-display);
      font-size: clamp(1.75rem, 4vw, 3rem);
      line-height: 1;
      letter-spacing: -0.01em;
      text-transform: uppercase;
      margin-bottom: 1.25rem;
    }
    p.lead {
      font-size: clamp(1rem, 1.2vw, 1.125rem);
      line-height: 1.55;
      color: var(--c-ink-50);
      max-width: 52ch;
      margin-bottom: 2.5rem;
    }
    .cta {
      display: inline-flex;
      align-items: center;
      gap: 0.85rem;
      padding: 1.1rem 2rem;
      background: var(--c-ink);
      color: var(--c-black);
      font-family: var(--ff-body);
      font-weight: 800;
      font-size: 0.85rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      text-decoration: none;
      border: 1px solid var(--c-ink);
      transition: background 0.3s var(--ease), color 0.3s var(--ease), transform 0.3s var(--ease);
    }
    .cta:hover {
      background: var(--c-blue);
      color: var(--c-ink);
      border-color: var(--c-blue);
      transform: translateX(4px);
    }
    .cta .arrow {
      display: inline-block;
      transition: transform 0.3s var(--ease);
    }
    .cta:hover .arrow { transform: translateX(4px); }
    footer {
      position: fixed;
      left: 0; right: 0; bottom: 0;
      padding: 1.25rem clamp(1.25rem, 4vw, 3rem);
      display: flex; justify-content: space-between;
      font-size: 0.7rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--c-ink-50);
      border-top: 1px solid var(--c-ink-10);
      background: var(--c-black);
    }
    @media (max-width: 600px) {
      footer { position: static; }
    }
  </style>
</head>
<body>
  <header class="header">
    <a href="/">CHESS</a>
  </header>
  <main>
    <section class="stage" aria-labelledby="err-heading">
      <div class="eyebrow">Error · Página no encontrada</div>
      <h1 id="err-heading">4<span class="accent">0</span>4</h1>
      <h2>Esta jugada no existe</h2>
      <p class="lead">La página que buscás no está en el tablero. Volvé al inicio para seguir explorando.</p>
      <a class="cta" href="/">
        Volver al inicio
        <span class="arrow" aria-hidden="true">→</span>
      </a>
    </section>
  </main>
  <footer>
    <span>Chess Producciones</span>
    <span>Buenos Aires · AR</span>
  </footer>
</body>
</html>
